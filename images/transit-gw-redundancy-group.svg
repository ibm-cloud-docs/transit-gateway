<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap');
      text {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#161616" />
    </marker>
  </defs>

  <!-- ================================================================= -->
  <!-- LAYER 1: GEOMETRY & SHAPES (Non-translatable background / icons)   -->
  <!-- ================================================================= -->
  <g id="layer-shapes">
    <!-- IBM Cloud Main Boundary -->
    <rect x="25" y="25" width="950" height="700" fill="#ffffff" stroke="#0f62fe" stroke-width="2" />

    <!-- IBM Cloud Icon -->
    <g transform="translate(30, 30)">
      <svg width="22" height="22" viewBox="0 0 32 32">
        <path fill="#0f62fe" d="M6 18a6 6 0 0 1 6-6h.4A7.99 7.99 0 0 1 28 16a8 8 0 0 1-8 8H6a6 6 0 0 1 0-12zm6-4a4 4 0 0 0-4 4 4 4 0 0 0 4 4h14a6 6 0 0 0 0-12 5.95 5.95 0 0 0-5.66 4H14a5.92 5.92 0 0 0-2-2z"/>
      </svg>
    </g>

    <!-- Redundancy Group Container (Purple) -->
    <rect x="140" y="65" width="685" height="235" fill="none" stroke="#8a3ffc" stroke-width="2" />

    <!-- Region eu-es Container (Teal) -->
    <rect x="205" y="118" width="260" height="115" fill="none" stroke="#007d79" stroke-width="1.5" />
    <g transform="translate(205, 118)">
      <rect width="26" height="26" fill="#007d79" />
      <path fill="#ffffff" d="M6 4v20h2V15h8l1 2.5h7V6h-9l-1-2H6zm2 2h7l1 2.5H22v5h-5.5l-1-2.5H8V6z" />
    </g>

    <!-- Transit Gateway A Icon -->
    <g transform="translate(308, 190)">
      <!-- Cardinal spokes -->
      <line x1="29" y1="6" x2="29" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="29" y1="36" x2="29" y2="52" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="29" x2="22" y2="29" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="29" x2="52" y2="29" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <!-- Diagonal spokes -->
      <line x1="12" y1="12" x2="22" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="36" x2="46" y2="46" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="12" x2="36" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="36" x2="12" y2="46" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <!-- Central filled circle -->
      <circle cx="29" cy="29" r="7" fill="#08bdba" />
      <!-- End terminals (cardinal) -->
      <circle cx="29" cy="6" r="3" fill="#003a6d" />
      <circle cx="29" cy="52" r="3" fill="#003a6d" />
      <circle cx="6" cy="29" r="3" fill="#003a6d" />
      <circle cx="52" cy="29" r="3" fill="#003a6d" />
      <!-- End terminals (diagonal) -->
      <circle cx="12" cy="12" r="3" fill="#003a6d" />
      <circle cx="46" cy="46" r="3" fill="#003a6d" />
      <circle cx="46" cy="12" r="3" fill="#003a6d" />
      <circle cx="12" cy="46" r="3" fill="#003a6d" />
    </g>

    <!-- Region br-sao Container (Teal) -->
    <rect x="530" y="118" width="260" height="115" fill="none" stroke="#007d79" stroke-width="1.5" />
    <g transform="translate(530, 118)">
      <rect width="26" height="26" fill="#007d79" />
      <path fill="#ffffff" d="M6 4v20h2V15h8l1 2.5h7V6h-9l-1-2H6zm2 2h7l1 2.5H22v5h-5.5l-1-2.5H8V6z" />
    </g>

    <!-- Transit Gateway B Icon -->
    <g transform="translate(633, 190)">
      <!-- Cardinal spokes -->
      <line x1="29" y1="6" x2="29" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="29" y1="36" x2="29" y2="52" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="29" x2="22" y2="29" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="29" x2="52" y2="29" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <!-- Diagonal spokes -->
      <line x1="12" y1="12" x2="22" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="36" x2="46" y2="46" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="12" x2="36" y2="22" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="36" x2="12" y2="46" stroke="#08bdba" stroke-width="2.5" stroke-linecap="round" />
      <!-- Central filled circle -->
      <circle cx="29" cy="29" r="7" fill="#08bdba" />
      <!-- End terminals (cardinal) -->
      <circle cx="29" cy="6" r="3" fill="#003a6d" />
      <circle cx="29" cy="52" r="3" fill="#003a6d" />
      <circle cx="6" cy="29" r="3" fill="#003a6d" />
      <circle cx="52" cy="29" r="3" fill="#003a6d" />
      <!-- End terminals (diagonal) -->
      <circle cx="12" cy="12" r="3" fill="#003a6d" />
      <circle cx="46" cy="46" r="3" fill="#003a6d" />
      <circle cx="46" cy="12" r="3" fill="#003a6d" />
      <circle cx="12" cy="46" r="3" fill="#003a6d" />
    </g>

    <!-- Region us-south Container -->
    <rect x="120" y="425" width="305" height="270" fill="none" stroke="#007d79" stroke-width="1.5" />
    <g transform="translate(120, 425)">
      <rect width="26" height="26" fill="#007d79" />
      <path fill="#ffffff" d="M6 4v20h2V15h8l1 2.5h7V6h-9l-1-2H6zm2 2h7l1 2.5H22v5h-5.5l-1-2.5H8V6z" />
    </g>

    <!-- VPC A Container inside us-south -->
    <rect x="183" y="520" width="170" height="100" fill="none" stroke="#0f62fe" stroke-width="1.5" />
    <g transform="translate(183, 520)">
      <rect width="26" height="26" fill="#0f62fe" />
      <path fill="#ffffff" d="M18 13v-2a3 3 0 0 0-6 0v2H9v8h12v-8h-3zm-5-2a2 2 0 0 1 4 0v2h-4v-2zm3 6h-1v2h-1v-2h-1v-2h3v2z"/>
    </g>

    <!-- Region us-east Container -->
    <rect x="583" y="425" width="295" height="270" fill="none" stroke="#007d79" stroke-width="1.5" />
    <g transform="translate(583, 425)">
      <rect width="26" height="26" fill="#007d79" />
      <path fill="#ffffff" d="M6 4v20h2V15h8l1 2.5h7V6h-9l-1-2H6zm2 2h7l1 2.5H22v5h-5.5l-1-2.5H8V6z" />
    </g>

    <!-- VPC B Container inside us-east -->
    <rect x="646" y="520" width="170" height="100" fill="none" stroke="#0f62fe" stroke-width="1.5" />
    <g transform="translate(646, 520)">
      <rect width="26" height="26" fill="#0f62fe" />
      <path fill="#ffffff" d="M18 13v-2a3 3 0 0 0-6 0v2H9v8h12v-8h-3zm-5-2a2 2 0 0 1 4 0v2h-4v-2zm3 6h-1v2h-1v-2h-1v-2h3v2z"/>
    </g>

    <!-- Cross Connectors with Bidirectional Arrows -->
    <!-- 1. TGW A <-> VPC A -->
    <line x1="330" y1="260" x2="280" y2="512" stroke="#161616" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <!-- 2. TGW A <-> VPC B -->
    <line x1="350" y1="260" x2="648" y2="515" stroke="#161616" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <!-- 3. TGW B <-> VPC A -->
    <line x1="626" y1="260" x2="350" y2="515" stroke="#161616" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <!-- 4. TGW B <-> VPC B -->
    <line x1="660" y1="260" x2="725" y2="512" stroke="#161616" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>

  <!-- ================================================================= -->
  <!-- LAYER 2: TRANSLATABLE TEXT (Machine Translation / G11N layer)     -->
  <!-- ================================================================= -->
  <g id="layer-text">
    <!-- Top-left Brand -->
    <text x="58" y="46" font-size="14" font-weight="600" fill="#161616">IBM Cloud</text>

    <!-- Redundancy Group Container Title -->
    <text x="153" y="90" font-size="14" font-weight="400" fill="#161616">Redundancy Group</text>

    <!-- Region eu-es -->
    <text x="240" y="136" font-size="13" font-weight="400" fill="#007d79">Region eu-es</text>
    <text x="337" y="176" font-size="13" font-weight="400" fill="#161616" text-anchor="middle">Global Transit Gateway A</text>

    <!-- Region br-sao -->
    <text x="565" y="136" font-size="13" font-weight="400" fill="#007d79">Region br-sao</text>
    <text x="662" y="176" font-size="13" font-weight="400" fill="#161616" text-anchor="middle">Global Transit Gateway B</text>

    <!-- Left Routing Annotation -->
    <text x="85" y="345" font-size="12" fill="#161616">
      <tspan x="85" dy="0" font-weight="700">VPC A</tspan>
      <tspan x="85" dy="17">10.4.0.0/16 from local</tspan>
      <tspan x="85" dy="17">10.5.0.0/16 via Transit Gateway A or B</tspan>
    </text>

    <!-- Right Routing Annotation -->
    <text x="740" y="345" font-size="12" fill="#161616">
      <tspan x="740" dy="0" font-weight="700">VPC B</tspan>
      <tspan x="740" dy="17">10.5.0.0/16 from local</tspan>
      <tspan x="740" dy="17">10.4.0.0/16 via Transit Gateway A or B</tspan>
    </text>

    <!-- Region us-south -->
    <text x="154" y="443" font-size="13" font-weight="400" fill="#007d79">Region us-south</text>
    <text x="217" y="537" font-size="12" fill="#161616">
      <tspan x="217" dy="0">Account A</tspan>
      <tspan x="217" dy="15" font-weight="700">VPC A</tspan>
    </text>
    <text x="268" y="583" font-size="13" font-weight="400" fill="#8a3ffc" text-anchor="middle">10.4.0.0/16</text>

    <!-- Region us-east -->
    <text x="618" y="443" font-size="13" font-weight="400" fill="#007d79">Region us-east</text>
    <text x="680" y="537" font-size="12" fill="#161616">
      <tspan x="680" dy="0">Account A</tspan>
      <tspan x="680" dy="15" font-weight="700">VPC B</tspan>
    </text>
    <text x="731" y="583" font-size="13" font-weight="400" fill="#8a3ffc" text-anchor="middle">10.5.0.0/16</text>
  </g>
</svg>
